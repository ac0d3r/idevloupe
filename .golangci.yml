version: "2"

run:
  timeout: 5m

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - intrange
    - misspell
    - nilerr
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      # Clearing a deadline after an exchange: a connection that fails it
      # fails the next read or write, which is checked.
      exclude-functions:
        - (net.Conn).SetDeadline
    staticcheck:
      # ST1000/ST1003: package comments and initialisms (UDID, IMEI) as written.
      checks: ["all", "-ST1000", "-ST1003"]
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    generated: strict
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ac0d3r/idevloupe
